<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Proglan C++ Exercises">
  <defs>
    <linearGradient id="proglan-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1526" />
      <stop offset="50%" stop-color="#0b080c" />
      <stop offset="100%" stop-color="#181026" />
    </linearGradient>
    <radialGradient id="proglan-glow" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0%" stop-color="#649ad2" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#649ad2" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="proglan-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2a4ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#c2a4ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#c2a4ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#proglan-bg)" />
  <rect width="1200" height="675" fill="url(#proglan-glow)" />

  <!-- code editor frame -->
  <g transform="translate(330 116)">
    <rect x="0" y="0" width="540" height="250" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#649ad2" stroke-opacity="0.4" stroke-width="2" />
    <rect x="0" y="0" width="540" height="42" rx="20" fill="#649ad2" fill-opacity="0.16" />
    <rect x="0" y="30" width="540" height="12" fill="#649ad2" fill-opacity="0.16" />
    <g fill="#ffffff" fill-opacity="0.35">
      <circle cx="30" cy="21" r="6" />
      <circle cx="52" cy="21" r="6" />
      <circle cx="74" cy="21" r="6" />
    </g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="21">
      <text x="34" y="90" fill="#c2a4ff" fill-opacity="0.85">#include &lt;iostream&gt;</text>
      <text x="34" y="126" fill="#ffffff" fill-opacity="0.55">int main() {</text>
      <text x="62" y="162" fill="#649ad2" fill-opacity="0.9">for (int i = 0; i &lt; n; ++i)</text>
      <text x="90" y="198" fill="#ffffff" fill-opacity="0.45">std::cout &lt;&lt; solve(i);</text>
      <text x="34" y="234" fill="#ffffff" fill-opacity="0.55">}</text>
    </g>
  </g>

  <text x="600" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="600" fill="#ffffff" letter-spacing="1">Proglan C++</text>
  <rect x="450" y="502" width="300" height="2" fill="url(#proglan-line)" />
  <text x="600" y="546" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" letter-spacing="6" fill="#c2a4ff" fill-opacity="0.85">COURSEWORK EXERCISES</text>
  <text x="600" y="592" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" letter-spacing="3" fill="#ffffff" fill-opacity="0.4">Teknik Komputer ITS</text>
</svg>

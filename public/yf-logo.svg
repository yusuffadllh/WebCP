<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0817" />
      <stop offset="100%" stop-color="#180f2b" />
    </linearGradient>

    <!-- Logo Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Accent Sparkle Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- YF Geometric Monogram Symbol -->
  <g filter="url(#glow)">
    <!-- Y Left Branch & Stem -->
    <path d="M 140 140 L 220 250 L 220 370 C 220 382 230 390 242 390 L 260 390 C 272 390 280 382 280 370 L 280 250 L 360 140 C 368 128 360 110 344 110 L 304 110 C 294 110 286 116 280 124 L 250 172 L 220 124 C 214 116 206 110 196 110 L 156 110 C 140 110 132 128 140 140 Z" fill="url(#primaryGrad)" />

    <!-- F Middle Horizontal Bar -->
    <path d="M 280 230 L 350 230 C 362 230 370 238 370 250 L 370 260 C 370 272 362 280 350 280 L 280 280 Z" fill="url(#primaryGrad)" opacity="0.9" />
    
    <!-- F Top Horizontal Bar -->
    <path d="M 310 170 L 380 170 C 392 170 400 178 400 190 L 400 195 C 400 207 392 215 380 215 L 300 215 Z" fill="url(#primaryGrad)" opacity="0.95" />
  </g>

  <!-- 4-Point Star Sparkle (Top Right Accent) -->
  <path d="M 390 100 Q 390 125 415 125 Q 390 125 390 150 Q 390 125 365 125 Q 390 125 390 100 Z" fill="url(#sparkGrad)" />
</svg>